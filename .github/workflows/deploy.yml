name: Build & Verify Cargova Logistics

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://cargova-logistics.vercel.app"
          NEXT_PUBLIC_CONTACT_EMAIL: "info@cargova-logistics.com"
          RESEND_API_KEY: "re_mock_test_key"
